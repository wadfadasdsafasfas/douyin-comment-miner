# /etc/nginx/sites-available/douyin-auth
# 反向代理：80 → 8000 (API) + 8501 (Admin)，为后面加 HTTPS 做准备

# HTTP 服务（现在用 IP 直连；以后有域名再启用 443）
server {
    listen 80 default_server;
    server_name _;

    # 允许上传大文件（升级包 zip ~100MB）
    client_max_body_size 200M;

    # 健康检查 / 默认页：返回 API 信息
    location = / {
        default_type application/json;
        return 200 '{"service":"DouyinCommentMiner Auth","api":"/api","admin":"/admin"}';
    }

    # API 服务
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 管理后台（Streamlit，baseUrlPath=/admin）
    location /admin {
        proxy_pass http://127.0.0.1:8501;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streamlit 用 WebSocket，需要下面这些
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Streamlit 静态资源
    location /_stcore/ {
        proxy_pass http://127.0.0.1:8501;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 升级包下载目录 —— GitHub Actions 通过 scp 把 zip 放到这里
    location /downloads/ {
        alias /opt/app/downloads/;
        add_header Content-Disposition attachment;
        add_header Cache-Control "no-cache";
        autoindex on;     # 调试方便，正式用可关掉
    }
}
