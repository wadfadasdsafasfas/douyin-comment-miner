# /etc/nginx/sites-enabled/douyin-auth
# 听潮 TideSignal —— 官网(/) + 授权API(/api) + 管理后台(/admin) + 下载(/downloads)
# 部署：cp deploy/nginx-douyin.conf /etc/nginx/sites-enabled/douyin-auth && nginx -t && systemctl reload nginx
# 注：线上此前被直接改过（与本文件不一致），本次以本文件为准统一。

server {
    listen 80 default_server;
    server_name _;

    # 升级包约 150MB，留足上传余量
    client_max_body_size 200M;

    # ---------- 官网静态站 ----------
    root /var/www/tingchao;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 授权 API ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---------- 管理后台 ----------
    # 结尾的 / 让 nginx 把 /admin/xxx 转成后端的 /xxx（后台路由本身不带 /admin 前缀）
    location /admin/static/ {
        proxy_pass http://127.0.0.1:8501/static/;
        proxy_set_header Host $host;
        expires 7d;
    }
    location /admin/ {
        proxy_pass http://127.0.0.1:8501/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
    # 后台未登录会重定向到 /login，补一条兜住，避免落到官网静态规则上 404
    location = /login {
        proxy_pass http://127.0.0.1:8501/login;
        proxy_set_header Host $host;
    }

    # ---------- 客户端升级包 ----------
    # autoindex 关闭：不对外列目录，只按精确文件名下载
    location /downloads/ {
        alias /opt/app/downloads/;
        add_header Content-Disposition attachment;
        add_header Cache-Control "no-cache";
        autoindex off;
    }

    # 老版本后台（Streamlit 时期）遗留路径，静默兜住避免 500
    location /_stcore/ {
        proxy_pass http://127.0.0.1:8501/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
