# 听潮 TideSignal —— 腾讯云(上海) 49.235.168.97（生产实况，certbot 已写入 443 与跳转）
# 证书: Let's Encrypt, SAN = tingchao/admin.tingchao.cengfengkeji.cn, certbot.timer 自动续期
# 注意: client_max_body_size 200M 在 certbot 重写后可能只剩 443 段,改上传限制时两段都要加

#       && ln -sfn ../sites-available/tingchao /etc/nginx/sites-enabled/tingchao
#       && 把 sites-enabled/default 改名为 default.disabled（避免 80 端口 default_server 冲突）
#       && nginx -t && systemctl reload nginx

server {
    server_name tingchao.cengfengkeji.cn 49.235.168.97 _;

    client_max_body_size 200M;

    root /var/www/tingchao;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 授权 API ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---------- 下载: 302 到 COS(去掉 /downloads 前缀, 对象键在桶根) ----------
    location /downloads/ {
        rewrite ^/downloads/(.*)$ https://tingchao-downloads-1315442697.cos.ap-beijing.myqcloud.com/$1 redirect;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tingchao.cengfengkeji.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tingchao.cengfengkeji.cn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# ---------- 管理后台子域名 ----------
server {
    server_name admin.tingchao.cengfengkeji.cn;

    client_max_body_size 50M;

    location = / { return 302 /admin/; }

    # 结尾的 / 让 nginx 把 /admin/xxx 转成后端 /xxx(后台路由本身不带前缀)
    location /admin/static/ {
        proxy_pass http://127.0.0.1:8501/static/;
        proxy_set_header Host $host;
        expires 7d;
    }
    location /admin/ {
        proxy_pass http://127.0.0.1:8501/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / { return 302 /admin/; }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tingchao.cengfengkeji.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tingchao.cengfengkeji.cn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = tingchao.cengfengkeji.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    server_name tingchao.cengfengkeji.cn 49.235.168.97 _;
    return 404; # managed by Certbot


}
server {
    if ($host = admin.tingchao.cengfengkeji.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name admin.tingchao.cengfengkeji.cn;
    return 404; # managed by Certbot


}