# 听潮 TideSignal —— 腾讯云(上海) 49.235.168.97
# 官网+授权API: tingchao.cengfengkeji.cn   管理后台: admin.tingchao.cengfengkeji.cn
# 部署: cp 本文件到 /etc/nginx/sites-available/tingchao
#       && ln -sfn ../sites-available/tingchao /etc/nginx/sites-enabled/tingchao
#       && 把 sites-enabled/default 改名为 default.disabled（避免 80 端口 default_server 冲突）
#       && nginx -t && systemctl reload nginx

server {
    listen 80 default_server;
    server_name tingchao.cengfengkeji.cn 49.235.168.97 _;

    client_max_body_size 200M;

    root /var/www/tingchao;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 授权 API ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---------- 下载: 302 到 COS(去掉 /downloads 前缀, 对象键在桶根) ----------
    location /downloads/ {
        rewrite ^/downloads/(.*)$ https://tingchao-downloads-1315442697.cos.ap-beijing.myqcloud.com/$1 redirect;
    }
}

# ---------- 管理后台子域名 ----------
server {
    listen 80;
    server_name admin.tingchao.cengfengkeji.cn;

    client_max_body_size 50M;

    location = / { return 302 /admin/; }

    # 结尾的 / 让 nginx 把 /admin/xxx 转成后端 /xxx(后台路由本身不带前缀)
    location /admin/static/ {
        proxy_pass http://127.0.0.1:8501/static/;
        proxy_set_header Host $host;
        expires 7d;
    }
    location /admin/ {
        proxy_pass http://127.0.0.1:8501/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / { return 302 /admin/; }
}
