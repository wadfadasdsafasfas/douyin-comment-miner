name: build-release

# 一次打 tag 同时出 Windows .exe 和 macOS .app，附到同一个 GitHub Release。
# 用法：
#   git tag v1.2.0 && git push origin v1.2.0
# 然后打开 Releases 页面，下载对应平台的 zip。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:    # 允许手动触发重跑

permissions:
  contents: write   # 创建 Release 需要写权限

jobs:
  # ============================================================
  #  1. Windows 打包：产出 DouyinCommentMiner.exe
  # ============================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖（阿里云镜像，国内 CI 友好）
        run: |
          python -m pip install --upgrade pip -i https://mirrors.aliyun.com/pypi/simple/
          python -m pip install -i https://mirrors.aliyun.com/pypi/simple/ `
            playwright openpyxl customtkinter pyinstaller requests

      - name: PyInstaller · onedir · windowed
        run: |
          python -m PyInstaller --noconfirm --clean `
            --name DouyinCommentMiner `
            --windowed `
            --onedir `
            --paths . `
            --collect-all playwright `
            --collect-all openpyxl `
            --collect-all customtkinter `
            --collect-all requests `
            --hidden-import openpyxl `
            --hidden-import requests `
            --hidden-import license `
            --hidden-import server_url `
            douyin_miner_gui.py

      # 如果目标电脑既没 Chrome 也没 Edge，把下面取消注释（产物会多 ~150MB）：
      # - name: 下载 Chromium 内核
      #   run: python -m playwright install chromium

      - name: 打 zip
        shell: pwsh
        run: |
          $zipName = "DouyinCommentMiner-windows-${{ github.ref_name }}.zip"
          if (Test-Path $zipName) { Remove-Item $zipName }
          Compress-Archive -Path dist/DouyinCommentMiner -DestinationPath $zipName
          Get-Item $zipName | Format-List Name, Length

      - name: 上传 zip 给 release job
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: DouyinCommentMiner-windows-*.zip
          if-no-files-found: error

  # ============================================================
  #  2. macOS 打包：产出 .app bundle
  # ============================================================
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖（阿里云镜像，国内 CI 友好）
        run: |
          python -m pip install --upgrade pip -i https://mirrors.aliyun.com/pypi/simple/
          python -m pip install -i https://mirrors.aliyun.com/pypi/simple/ \
            playwright openpyxl customtkinter pyinstaller requests

      - name: PyInstaller · onedir · windowed
        run: |
          python -m PyInstaller --noconfirm --clean \
            --name DouyinCommentMiner \
            --windowed \
            --onedir \
            --paths . \
            --collect-all playwright \
            --collect-all openpyxl \
            --collect-all customtkinter \
            --collect-all requests \
            --hidden-import openpyxl \
            --hidden-import requests \
            --hidden-import license \
            --hidden-import server_url \
            --osx-bundle-identifier com.wadfadasdsafasfas.douyinminer \
            douyin_miner_gui.py

      # 同上：纯裸机没装 Chrome/Edge 时取消注释：
      # - name: 下载 Chromium 内核
      #   run: python -m playwright install chromium

      - name: 打 zip（.app 整个打成 zip）
        run: |
          ZIPNAME="DouyinCommentMiner-macOS-${{ github.ref_name }}.zip"
          cd dist
          zip -r "../$ZIPNAME" DouyinCommentMiner.app
          cd ..
          ls -la "$ZIPNAME"

      - name: 上传 zip 给 release job
        uses: actions/upload-artifact@v4
        with:
          name: macos-zip
          path: DouyinCommentMiner-macOS-*.zip
          if-no-files-found: error

  # ============================================================
  #  3. 汇总 Release：等上面两个都跑完，把 zip 附到同一个 release
  # ============================================================
  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-zip'
          path: artifacts
          merge-multiple: true

      - name: 列一下下载下来的文件
        run: ls -la artifacts/

      - name: 创建 Release 并上传所有 zip
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true