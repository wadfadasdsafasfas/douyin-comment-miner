name: build-release

# 听潮 TideSignal —— Electron 桌面端双平台打包
# 一次 tag 同时产出 4 类包：
#   Windows  TingChao-windows-vX.Y.Z-setup.exe        （安装包）
#   Windows  TingChao-windows-vX.Y.Z.zip              （绿色免安装）
#   macOS    TingChao-macos-vX.Y.Z-{arm64,x64}.dmg    （安装包，双架构）
#   macOS    TingChao-macos-vX.Y.Z-{arm64,x64}.zip    （绿色免安装，双架构）
# 用法：git tag v1.0.1 && git push origin v1.0.1
# 说明：GitHub runner 到国内云服务器网络不稳，上传服务器与写 latest_version 由本地脚本完成。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

jobs:
  # ============================================================
  #  1. Windows：PyInstaller 打 sidecar → electron-builder 出 nsis + zip
  # ============================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 Python 依赖（清华镜像 + 阿里云 fallback）
        run: |
          python -m pip install --upgrade pip -i https://pypi.tuna.tsinghua.edu.cn/simple
          python -m pip install `
            --index-url https://pypi.tuna.tsinghua.edu.cn/simple `
            --extra-index-url https://mirrors.aliyun.com/pypi/simple/ `
            --extra-index-url https://pypi.org/simple `
            -r requirements.txt pyinstaller

      - name: 安装前端依赖
        working-directory: electron
        run: npm ci --no-audit --no-fund

      - name: 打 sidecar（本地 HTTP/SSE 服务）
        shell: bash
        run: bash ./build_sidecar.sh

      - name: 冒烟：sidecar 能起并返回健康检查
        shell: bash
        run: |
          ./dist-sidecar/tingchao-sidecar/tingchao-sidecar.exe --port 8799 > sc.log 2>&1 &
          PID=$!
          OK=0
          for i in $(seq 1 30); do
            sleep 2
            if curl -sf -m 5 http://127.0.0.1:8799/api/health -o health.json; then
              echo "健康检查返回：$(cat health.json)"; OK=1; break
            fi
          done
          kill $PID 2>/dev/null || true
          if [ "$OK" != "1" ]; then echo "=== sidecar 日志 ==="; cat sc.log; exit 1; fi

      - name: electron-builder 打包（nsis 安装包 + 绿色 zip）
        working-directory: electron
        run: npx electron-builder --win --x64

      - name: 列出产物
        shell: bash
        run: ls -la electron/release/*.exe electron/release/*.zip 2>/dev/null

      - name: 上传产物给 release job
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            electron/release/TingChao-windows-*.exe
            electron/release/TingChao-windows-*.zip
          if-no-files-found: error

  # ============================================================
  #  2. macOS：双架构 dmg + zip（Apple Silicon 与 Intel）
  # ============================================================
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip -i https://pypi.tuna.tsinghua.edu.cn/simple
          python -m pip install \
            --index-url https://pypi.tuna.tsinghua.edu.cn/simple \
            --extra-index-url https://mirrors.aliyun.com/pypi/simple/ \
            --extra-index-url https://pypi.org/simple \
            -r requirements.txt pyinstaller

      - name: 安装前端依赖
        working-directory: electron
        run: npm ci --no-audit --no-fund

      - name: 打 sidecar
        run: bash ./build_sidecar.sh

      - name: electron-builder 打包（arm64 + x64 的 dmg 与 zip）
        working-directory: electron
        run: npx electron-builder --mac --arm64 --x64

      - name: 上传产物给 release job
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: |
            electron/release/TingChao-macos-*.dmg
            electron/release/TingChao-macos-*.zip
          if-no-files-found: error

  # ============================================================
  #  3. 汇总到同一个 GitHub Release
  # ============================================================
  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-packages'
          path: artifacts
          merge-multiple: true

      - name: 列出全部产物
        run: ls -la artifacts/

      - name: 创建 Release 并附上所有安装包
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
