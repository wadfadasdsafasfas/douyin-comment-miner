name: build-release

# 一次打 tag 同时出 Windows .exe 和 macOS .app，附到同一个 GitHub Release。
# 用法：
#   git tag v1.2.0 && git push origin v1.2.0
# 然后打开 Releases 页面，下载对应平台的 zip。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:    # 允许手动触发重跑

permissions:
  contents: write   # 创建 Release 需要写权限

jobs:
  # ============================================================
  #  1. Windows 打包：产出 DouyinCommentMiner.exe
  # ============================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖（阿里云镜像，国内 CI 友好）
        run: |
          python -m pip install --upgrade pip -i https://mirrors.aliyun.com/pypi/simple/
          python -m pip install -i https://mirrors.aliyun.com/pypi/simple/ `
            playwright openpyxl customtkinter pyinstaller requests

      - name: PyInstaller · onedir · windowed
        run: |
          python -m PyInstaller --noconfirm --clean `
            --name DouyinCommentMiner `
            --windowed `
            --onedir `
            --paths . `
            --collect-all playwright `
            --collect-all openpyxl `
            --collect-all customtkinter `
            --collect-all requests `
            --hidden-import openpyxl `
            --hidden-import requests `
            --hidden-import license `
            --hidden-import server_url `
            --hidden-import updater `
            douyin_miner_gui.py

      # 如果目标电脑既没 Chrome 也没 Edge，把下面取消注释（产物会多 ~150MB）：
      # - name: 下载 Chromium 内核
      #   run: python -m playwright install chromium

      - name: 打 zip
        shell: pwsh
        run: |
          $zipName = "DouyinCommentMiner-windows-${{ github.ref_name }}.zip"
          if (Test-Path $zipName) { Remove-Item $zipName }
          Compress-Archive -Path dist/DouyinCommentMiner -DestinationPath $zipName
          Get-Item $zipName | Format-List Name, Length

      - name: 上传 zip 给 release job
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: DouyinCommentMiner-windows-*.zip
          if-no-files-found: error

      - name: scp 到服务器（给客户下载升级用）
        if: ${{ env.SERVER_SSH_KEY != '' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "DouyinCommentMiner-windows-*.zip"
          target: /opt/app/downloads/

  # ============================================================
  #  2. macOS 打包：产出 .app bundle
  # ============================================================
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖（阿里云镜像，国内 CI 友好）
        run: |
          python -m pip install --upgrade pip -i https://mirrors.aliyun.com/pypi/simple/
          python -m pip install -i https://mirrors.aliyun.com/pypi/simple/ \
            playwright openpyxl customtkinter pyinstaller requests

      - name: PyInstaller · onedir · windowed
        run: |
          python -m PyInstaller --noconfirm --clean \
            --name DouyinCommentMiner \
            --windowed \
            --onedir \
            --paths . \
            --collect-all playwright \
            --collect-all openpyxl \
            --collect-all customtkinter \
            --collect-all requests \
            --hidden-import openpyxl \
            --hidden-import requests \
            --hidden-import license \
            --hidden-import server_url \
            --hidden-import updater \
            --osx-bundle-identifier com.wadfadasdsafasfas.douyinminer \
            douyin_miner_gui.py

      # 同上：纯裸机没装 Chrome/Edge 时取消注释：
      # - name: 下载 Chromium 内核
      #   run: python -m playwright install chromium

      - name: 打 zip（.app 整个打成 zip）
        run: |
          ZIPNAME="DouyinCommentMiner-macOS-${{ github.ref_name }}.zip"
          cd dist
          zip -r "../$ZIPNAME" DouyinCommentMiner.app
          cd ..
          ls -la "$ZIPNAME"

      - name: 上传 zip 给 release job
        uses: actions/upload-artifact@v4
        with:
          name: macos-zip
          path: DouyinCommentMiner-macOS-*.zip
          if-no-files-found: error

      - name: scp 到服务器（给客户下载升级用）
        if: ${{ env.SERVER_SSH_KEY != '' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "DouyinCommentMiner-macOS-*.zip"
          target: /opt/app/downloads/

  # ============================================================
  #  3. 汇总 Release：等上面两个都跑完，把 zip 附到同一个 release
  # ============================================================
  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-zip'
          path: artifacts
          merge-multiple: true

      - name: 列一下下载下来的文件
        run: ls -la artifacts/

      - name: 创建 Release 并上传所有 zip
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true

      # 通知服务器：新版本上线（写 windows_url / macos_url / latest_version）
      # admin 密码从 secrets 读，登录拿 token，调 /api/admin/config
      - name: 把版本信息写入授权服务器
        if: ${{ env.ADMIN_PASSWORD != '' }}
        env:
          SERVER: ${{ secrets.SERVER_URL }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          VERSION: ${{ github.ref_name }}    # e.g. v1.3.0
        run: |
          # 从 tag 名剥掉 'v' 前缀作为版本号
          VER="${VERSION#v}"
          WIN_URL="${SERVER}/downloads/DouyinCommentMiner-windows-${VERSION}.zip"
          MAC_URL="${SERVER}/downloads/DouyinCommentMiner-macOS-${VERSION}.zip"

          # 1. admin 登录拿 token
          TOKEN=$(curl -fsS -X POST "${SERVER}/api/admin/login" \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"${ADMIN_USER}\",\"password\":\"${ADMIN_PASSWORD}\"}" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["admin_token"])')

          # 2. 写版本信息
          curl -fsS -X POST "${SERVER}/api/admin/config" \
            -H "X-Admin-Token: ${TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "{\"latest_version\":\"${VER}\",\"windows_url\":\"${WIN_URL}\",\"macos_url\":\"${MAC_URL}\"}" \
            && echo "✅ 已把 ${VER} 写入服务器配置"